# Voice casting + TTS parameters. FINAL (gate G1 answered): ONE voice per role for the whole MVP; the hero call and all
# sample calls use these same voices with different scripts. Model timbre-v3.0 (a wrong voice/model pairing returns HTTP 400).
model: timbre-v3.0
roles:
  agent:       {voice: Prakash, gender: M, note: "all agent turns (every agent in agents.yaml speaks with this voice)"}
  borrower:    {voice: Shivani, gender: F, note: "all borrower turns; no tags"}
  third_party: {voice: Avinash, gender: M, note: "neighbour / relative; no tags"}
  coach:       {voice: Shubham, gender: M, note: "clean full-band, plain"}
  vo:          {voice: Shubham, gender: M, note: "video voice-over, same voice as the coach, wideband phone sound (vo_chain)"}
# Script consequence: agent = male, borrower = female, third party = male (Hindi verb forms in every scenario must match).
# scenario borrower.voice codes (m1/m2/f) and agents.yaml voice_role are legacy casting hints; the audio notebooks ignore
# them and always use the roles above.

text_mode: devanagari   # all TTS input is the Devanagari line (`td`); `t` stays the Roman reference text
borrower_language: hi-IN

params:            # per role group; names must match the real API fields
  agent:    {language: "hi-IN", speed: 1.0}
  borrower: {language: "hi-IN", speed: 0.95}
  third:    {language: "hi-IN", speed: 0.95}
  coach:    {language: "hi-IN", speed: 1.0}
  vo:       {language: "hi-IN", speed: 1.0}
audio_request: {format: wav, channels: 1, bit_depth: 16, sample_rate: 48000}
text_rules:
  max_chars_per_request: 600     # playground limit seen: 800
  split_on: sentence_boundaries
  numbers: "keep amounts written as words (see scripts)"
  pitch_volume_emotion: "leave API defaults"
tags:              # timbre-v3.0 audio tags; unknown tags are stripped silently and billed as characters
  allowed: only_shouting_on_agent_threat_line
  rule: "ONLY <shouting>, ONLY at the very start of the agent's threat line (c06 turn 5), so every word is covered. No tag anywhere else unless the user asks."
  shout_gain_db: 2.5            # above the agent's normal level
  shout_target_lufs: -19.5      # integrated, +-0.5 LU; the only exemption from the agent's -22 LUFS (true peak <= -1.5 dBTP)

loudness:          # integrated LUFS of the FINISHED files, measured with ebur128 (docs/11 section 10)
  agent: -22 LUFS               # call voices: normalised AFTER the phone chain (the chain lowers the level), true peak <= -1.5 dBTP
  borrower: -24 LUFS            # slightly quieter, "further from handset"
  third_party: -25 LUFS
  coach: -27 LUFS               # clean full-band, so it sounds distinct; chime at the same level. Browser playback gain for the coach = 1.0
  vo: -18 LUFS                  # wideband phone sound (vo_chain)

phone_chain:       # applied to call audio only (not coach)
  resample_hz: 8000
  bandpass_hz: [300, 3400]      # Butterworth order 4
  compressor: {threshold_db: -18, ratio: 3, attack_ms: 5, release_ms: 80}
  mulaw_codec: false            # optional extra realism, off by default
  turn_gap_ms: [350, 700]       # random, seed 42
  leading_silence_ms: 300
vo_chain:          # voice-over only: same compressor as the call chain, wider band, no noise
  resample_hz: 16000
  bandpass_hz: [200, 6500]
  compressor: {threshold_db: -18, ratio: 3, attack_ms: 5, release_ms: 80}
mp3: {call_audio: "64 kbps mono", coach_vo: "128 kbps mono"}
