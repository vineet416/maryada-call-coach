        t: "Arre sir, dhamki kyun de rahe ho? Maine kab bola ki paisa nahi dungi? Bas thoda time chahiye, samjho na."
        td: "अरे सर, धमकी क्यों दे रहे हो? मैंने कब बोला कि पैसा नहीं दूँगी? बस थोड़ा टाइम चाहिए, समझो ना।"
      - s: A
        t: "Sorry madam, aap galat mat samjhiye. Dekhiye, poora ek saath nahi ho raha to thoda abhi kar do, baaki ki installment bana dete hain. Friday tak kitna kar sakti hain?"
        td: "सॉरी मैडम, आप ग़लत मत समझिए। देखिए, पूरा एक साथ नहीं हो रहा तो थोड़ा अभी कर दो, बाकी की इंस्टॉलमेंट बना देते हैं। फ्राइडे तक कितना कर सकती हैं?"
      - s: B
        t: "Okay, theek hai. Friday tak teen hazaar de sakti hoon. Baaki next month se thoda thoda karke dungi."
        td: "ओके, ठीक है। फ्राइडे तक तीन हज़ार दे सकती हूँ। बाकी नेक्स्ट मंथ से थोड़ा थोड़ा करके दूँगी।"
      - s: A
        t: "Theek hai madam, Friday tak teen hazaar pakka. Baaki ka plan next month se, main system mein note kar deta hoon. Payment link abhi WhatsApp pe bhej raha hoon. Thank you, aapka din accha rahe."
        td: "ठीक है मैडम, फ्राइडे तक तीन हज़ार पक्का। बाकी का प्लान नेक्स्ट मंथ से, मैं सिस्टम में नोट कर देता हूँ। पेमेंट लिंक अभी व्हाट्सएप पर भेज रहा हूँ। थैंक यू, आपका दिन अच्छा रहे।"
