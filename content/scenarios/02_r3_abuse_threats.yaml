      - s: A
        t: "Madam, ye sab toh har koi bolta hai. Next week, next week... Mereko aaj hi payment chahiye. Dekho, aaj shaam tak payment nahi aaya na, to police ko bhejunga aapke ghar. Aapke mohalle mein sabko bata dunga ki aap defaulter ho. Court ka notice bhi kal subah aa jayega. Samjhi?"
        td: "मैडम, ये सब तो हर कोई बोलता है। नेक्स्ट वीक, नेक्स्ट वीक... मेरेको आज ही पेमेंट चाहिए। देखो, आज शाम तक पेमेंट नहीं आया ना, तो पुलिस को भेजूँगा आपके घर। आपके मोहल्ले में सबको बता दूँगा कि आप डिफॉल्टर हो। कोर्ट का नोटिस भी कल सुबह आ जाएगा। समझी?"
