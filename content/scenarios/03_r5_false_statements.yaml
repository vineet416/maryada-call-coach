        t: "Rekha ji, aapki chhah hazaar ki EMI pachchis din se pending hai, ek baar bounce bhi hui. Aap kab tak bhar paayengi?"
        td: "रेखा जी, आपकी छह हज़ार की ईएमआई पच्चीस दिन से पेंडिंग है, एक बार बाउंस भी हुई। आप कब तक भर पाएँगी?"
      - s: B
