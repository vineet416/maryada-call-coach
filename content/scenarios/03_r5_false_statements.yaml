      - s: B
        t: "Kya? RBI? Aisa ho sakta hai kya? Mereko toh pata hi nahi tha."
        td: "क्या? आरबीआई? ऐसा हो सकता है क्या? मेरेको तो पता ही नहीं था।"
      - s: A
        t: "Haan madam, isliye aaj hi bhar dijiye. Thoda bhi bhar do toh chalega."
        td: "हाँ मैडम, इसलिए आज ही भर दीजिए। थोड़ा भी भर दो तो चलेगा।"
      - s: B
        t: "Aaj nahi ho payega madam, kal shaam tak kar dungi. Pakka bol rahi hoon."
        td: "आज नहीं हो पाएगा मैडम, कल शाम तक कर दूँगी। पक्का बोल रही हूँ।"
      - s: A
        t: "Theek hai, kal shaam tak pakka. UPI se kar dena."
        td: "ठीक है, कल शाम तक पक्का। यूपीआई से कर देना।"
