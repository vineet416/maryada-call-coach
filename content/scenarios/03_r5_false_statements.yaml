# c11-c14: R5 (false or misleading statements about legal consequences, authority or charges)
scenarios:
  - id: c11
    title: "Fake arrest warrant"
    summary: "Agent claims a warrant has been issued and the police will pick the borrower up."
    agent: A3
    date: "2026-10-19"
    time: "12:00"
    answered_by: borrower
    borrower: {name: "Kiran Sawant", voice: m1}
    facts: {product: "personal loan", emi_inr: 10000, dpd_days: 62}
    hero: false
    hard_negative: false
    turns:
      - {s: A, t: "Rohit bol raha hoon Tarang Finserv se, call record ho rahi hai. Kiran Sawant ji se baat ho rahi hai?"}
      - {s: B, t: "Haan, boliye."}
      - {s: A, t: "Aapki EMI das hazaar rupaye ki do mahine se due hai. Kab tak payment hoga?"}
      - {s: B, t: "Saheb, abhi paisa nahi aahe. Ek mahina de do."}
      - s: A
        t: "Ek mahina nahi milega. Court se aapke naam par arrest warrant nikal chuka hai, kabhi bhi police pakad legi."
        L: [[R5, "Court se aapke naam par arrest warrant nikal chuka hai"]]
      - {s: B, t: "Kay? Warrant? Mala kuch notice nahi aaya."}
      - s: A
        t: "Aaya nahi toh ab aayega. Abhi paisa bhar do toh warrant ruk sakta hai."
        L: [[R5, "paisa bhar do toh warrant ruk sakta hai"]]
      - {s: B, t: "Main bank jaata hoon aaj, kuch deta hoon."}
