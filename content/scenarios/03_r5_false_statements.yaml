# c11-c14: R5 (false or misleading statements about legal consequences, authority or charges)
scenarios:
  - id: c11
    title: "Fake arrest warrant"
    summary: "Agent claims a warrant has been issued and the police will pick the borrower up."
    agent: A3
    date: "2026-10-19"
    time: "12:00"
    answered_by: borrower
    borrower: {name: "Kiran Sawant", voice: m1}
    facts: {product: "personal loan", emi_inr: 10000, dpd_days: 62}
    hero: false
    hard_negative: false
    turns:
      - s: A
        t: "Namaste, Kiran Sawant ji?"
        td: "नमस्ते, किरण सावंत जी?"
      - s: B
        t: "Haan? Kaun bol raha hai?"
        td: "हाँ? कौन बोल रहा है?"
      - s: A
        t: "Rohit bol raha hoon, Tarang Finserv se. Aur call recorded hai, quality purpose ke liye."
        td: "रोहित बोल रहा हूँ, तारंग फिनसर्व से। और कॉल रिकॉर्डेड है, क्वालिटी पर्पज़ के लिए।"
      - s: B
        t: "Haan, boliye."
        td: "हाँ, बोलिए।"
      - s: A
        t: "Kiran ji, das hazaar ki EMI do mahine se pending hai, dono baar bounce hui. Penalty bhi chadh rahi hai. Kab tak bharenge?"
        td: "किरण जी, दस हज़ार की ईएमआई दो महीने से पेंडिंग है, दोनों बार बाउंस हुई। पेनल्टी भी चढ़ रही है। कब तक भरेंगे?"
      - s: B
        t: "Sir, abhi paisa nahi hai. Naukri mein bhi dikkat chal rahi hai. Ek mahina de do, kuch arrange karta hoon."
        td: "सर, अभी पैसा नहीं है। नौकरी में भी दिक्कत चल रही है। एक महीना दे दो, कुछ अरेंज करता हूँ।"
      - s: A
        t: "Ek mahina nahi milega, Kiran ji. Mereko aaj ka bolo. Court se aapke naam par arrest warrant nikal chuka hai, kabhi bhi police pakad legi."
        td: "एक महीना नहीं मिलेगा, किरण जी। मेरेको आज का बोलो। कोर्ट से आपके नाम पर अरेस्ट वारंट निकल चुका है, कभी भी पुलिस पकड़ लेगी।"
        L: [[R5, "Court se aapke naam par arrest warrant nikal chuka hai"]]
      - s: B
        t: "Kya? Warrant? Mereko toh koi notice bhi nahi aaya."
        td: "क्या? वारंट? मेरेको तो कोई नोटिस भी नहीं आया।"
      - s: A
        t: "Aaya nahi toh ab aayega. Abhi paisa bhar do toh warrant ruk sakta hai."
        td: "आया नहीं तो अब आएगा। अभी पैसा भर दो तो वारंट रुक सकता है।"
        L: [[R5, "paisa bhar do toh warrant ruk sakta hai"]]
      - s: B
        t: "Sir please, aise mat bolo. Main aaj hi bank jaata hoon, kuch deta hoon. Do-teen hazaar abhi, baaki baad mein."
        td: "सर प्लीज़, ऐसे मत बोलो। मैं आज ही बैंक जाता हूँ, कुछ देता हूँ। दो-तीन हज़ार अभी, बाकी बाद में।"
      - s: A
        t: "Theek hai, aaj hi karo. Do-teen hazaar bhi chalega, bas aaj ho jaye."
        td: "ठीक है, आज ही करो। दो-तीन हज़ार भी चलेगा, बस आज हो जाए।"
