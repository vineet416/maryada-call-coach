        td: "अगले महीने तक? रेखा जी, ये नहीं चलेगा। देखिए, मैं आरबीआई की तरफ से भी बोल रही हूँ, आरबीआई आपका लोन अकाउंट ब्लॉक कर देगी और आपको किसी बैंक से लोन नहीं मिलेगा ज़िंदगी भर।"
