        t: "Madam, tension ki koi baat nahi hai. Bas ek zaroori call hai, aur woh unse hi discuss karni hai. Aap unko sirf call karne ke liye bol dijiye."
        td: "मैडम, टेंशन की कोई बात नहीं है। बस एक ज़रूरी कॉल है, और वो उनसे ही डिस्कस करनी है। आप उनको सिर्फ़ कॉल करने के लिए बोल दीजिए।"
