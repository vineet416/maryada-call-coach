# c15-c18: R4 (third-party disclosure). c18 is the CONTROL: agent only asks for the borrower (no violation, hard negative).
scenarios:
  - id: c15
    title: "Debt disclosed to the borrower's wife"
    summary: "Spouse answers; agent reveals the loan and the arrears."
    agent: A3
    date: "2026-10-25"
    time: "11:30"
    answered_by: spouse
    borrower: {name: "Hemant Joshi", voice: m1}
    third_party: {voice: spouse_f}
    facts: {product: "personal loan", emi_inr: 3300, dpd_days: 180}
    hero: false
    hard_negative: false
    turns:
      - s: A
        t: "Hello, Hemant Joshi bol rahe hain?"
        td: "हैलो, हेमंत जोशी बोल रहे हैं?"
      - s: T
        t: "Nahi ji, woh ghar pe nahi hain. Main unki wife bol rahi hoon. Aap kaun?"
        td: "नहीं जी, वो घर पे नहीं हैं। मैं उनकी वाइफ बोल रही हूँ। आप कौन?"
      - s: A
        t: "Main Rohit bol raha hoon, Tarang Finserv se. Ye call quality aur training ke liye record ho rahi hai. Hemant ji se hi baat karni hai, woh kab tak milenge?"
        td: "मैं रोहित बोल रहा हूँ, तारंग फिनसर्व से। ये कॉल क्वालिटी और ट्रेनिंग के लिए रिकॉर्ड हो रही है। हेमंत जी से ही बात करनी है, वो कब तक मिलेंगे?"
      - s: T
        t: "Woh bahar gaye hain, shaam ko aayenge. Kya kaam hai unse?"
        td: "वो बाहर गए हैं, शाम को आएँगे। क्या काम है उनसे?"
      - s: A
        t: "Madam, kaam yeh hai ki aapke pati ne Tarang Finserv se loan liya tha aur chhah mahine se EMI nahi bhar rahe. Total bees hazaar rupaye baaki hain. Hum kitne din se call kar rahe hain, woh phone hi nahi uthate. Mujhe unse baat karni hi padegi."
        td: "मैडम, काम ये है कि आपके पति ने तारंग फिनसर्व से लोन लिया था और छह महीने से ईएमआई नहीं भर रहे। टोटल बीस हज़ार रुपये बाकी हैं। हम कितने दिन से कॉल कर रहे हैं, वो फोन ही नहीं उठाते। मुझे उनसे बात करनी ही पड़ेगी।"
        L: [[R4, "aapke pati ne Tarang Finserv se loan liya tha aur chhah mahine se EMI nahi bhar rahe"]]
      - s: T
        t: "Mereko kuch pata nahi hai, unhone mereko kuch bataya nahi. Aap mereko kyun bol rahe ho ye sab?"
        td: "मेरेको कुछ पता नहीं है, उन्होंने मेरेको कुछ बताया नहीं। आप मेरेको क्यों बोल रहे हो ये सब?"
      - s: A
        t: "Achha achha. Theek hai madam, unko bol dena ki Rohit ka phone aaya tha, woh wapas call kar lein. Aaj shaam tak kar lein toh achha hai."
        td: "अच्छा अच्छा। ठीक है मैडम, उनको बोल देना कि रोहित का फोन आया था, वो वापस कॉल कर लें। आज शाम तक कर लें तो अच्छा है।"
      - s: T
        t: "Haan, main bol dungi. Par aap baar baar phone mat karna, ghar mein tension ho jaata hai."
        td: "हाँ, मैं बोल दूँगी। पर आप बार बार फोन मत करना, घर में टेंशन हो जाता है।"
      - s: A
        t: "Theek hai madam, main shaam ko ek baar dobara call karunga. Thank you."
        td: "ठीक है मैडम, मैं शाम को एक बार दोबारा कॉल करूँगा। थैंक यू।"
  - id: c16
    title: "Shaming through the neighbour"
    summary: "Neighbour answers; agent discloses the debt and asks him to tell the society."
    agent: A6
    date: "2026-10-24"
    time: "13:20"
    answered_by: neighbour
    borrower: {name: "Anand Dalvi", voice: m1}
    third_party: {voice: neighbour_m}
    facts: {product: "personal loan", emi_inr: 7800, dpd_days: 50}
    hero: false
    hard_negative: false
    turns:
      - s: A
        t: "Hello, Anand Dalvi bol rahe hain?"
        td: "हैलो, आनंद दलवी बोल रहे हैं?"
      - s: T
        t: "Nahi, main padosi hoon. Anand bahar gaye hain. Kya hua?"
        td: "नहीं, मैं पड़ोसी हूँ। आनंद बाहर गए हैं। क्या हुआ?"
      - s: A
        t: "Main Kavita bol rahi hoon, Tarang Finserv se. Ye call quality aur training ke liye record ho rahi hai. Ye Anand ji ka hi number hai na?"
        td: "मैं कविता बोल रही हूँ, तारंग फिनसर्व से। ये कॉल क्वालिटी और ट्रेनिंग के लिए रिकॉर्ड हो रही है। ये आनंद जी का ही नंबर है ना?"
      - s: T
        t: "Haan, unka hi number hai. Par woh abhi nahi hain. Aap kya kaam bol rahi thi?"
        td: "हाँ, उनका ही नंबर है। पर वो अभी नहीं हैं। आप क्या काम बोल रही थीं?"
      - s: A
        t: "Dekhiye, woh phone hi nahi uthate. Aap unko bata dena ki Anand ne loan liya hai aur dhokha de raha hai, paisa wapas nahi karta. Sab padosi jaan lein toh achha hai."
        td: "देखिए, वो फोन ही नहीं उठाते। आप उनको बता देना कि आनंद ने लोन लिया है और धोखा दे रहा है, पैसा वापस नहीं करता। सब पड़ोसी जान लें तो अच्छा है।"
        L: [[R4, "Anand ne loan liya hai aur dhokha de raha hai"], [R4, "Sab padosi jaan lein toh achha hai"]]
      - s: T
        t: "Arre baap re, mereko kya pata. Main kuch nahi bol sakta."
        td: "अरे बाप रे, मेरेको क्या पता। मैं कुछ नहीं बोल सकता।"
      - s: A
        t: "Itna toh kar hi sakte hain aap. Aap bol dena, unki society mein sabko pata chalna chahiye."
        td: "इतना तो कर ही सकते हैं आप। आप बोल देना, उनकी सोसाइटी में सबको पता चलना चाहिए।"
        L: [[R4, "unki society mein sabko pata chalna chahiye"]]
      - s: T
        t: "Main nahi bolunga ji. Ye aapka aur unka matter hai, aap unka number lo aur unse hi baat karo."
        td: "मैं नहीं बोलूँगा जी। ये आपका और उनका मैटर है, आप उनका नंबर लो और उनसे ही बात करो।"
      - s: A
        t: "Theek hai, main unko dobara call karti hoon. Thank you."
        td: "ठीक है, मैं उनको दोबारा कॉल करती हूँ। थैंक यू।"
