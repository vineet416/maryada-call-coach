        t: "Namaste madam. Main Amit bol raha hoon, Tarang Finserv se. Ye call quality aur training ke liye record ho rahi hai. Pramod ji ke liye ek zaroori call hai, woh kab tak milenge?"
        td: "नमस्ते मैडम। मैं अमित बोल रहा हूँ, तारंग फिनसर्व से। ये कॉल क्वालिटी और ट्रेनिंग के लिए रिकॉर्ड हो रही है। प्रमोद जी के लिए एक ज़रूरी कॉल है, वो कब तक मिलेंगे?"
      - s: T
        t: "Woh shaam ko aate hain. Aap mereko bata do kya baat hai, main bol dungi."
