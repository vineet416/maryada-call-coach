        td: "नहीं मैडम, बात उनसे ही करनी है। आप बस इतना बता दीजिए कि अमित का फोन आया था, और वो इस नंबर पर वापस कॉल कर लें।"
      - s: T
        t: "Lekin kis baare mein hai, ye toh bata do. Mereko tension ho raha hai."
