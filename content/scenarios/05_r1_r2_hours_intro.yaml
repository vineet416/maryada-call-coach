    summary: "Polite agent, but the call starts after 19:00."
    agent: A8
    date: "2026-10-22"
    time: "19:25"
    answered_by: borrower
    borrower: {name: "Sunil Pawar", voice: m2}
    facts: {product: "personal loan", emi_inr: 6000, dpd_days: 12}
    hero: false
    hard_negative: false
