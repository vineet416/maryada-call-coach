# c19-c21: R1 (call outside 08:00-19:00, otherwise polite). c22-c24: R2 (no name/company/recording notice in the first two agent turns).
# R1 label sits on the FIRST agent turn ("*" = call-level). R2 label sits on the SECOND agent turn ("*" = whole turn).
scenarios:
  - id: c19
    title: "Call at 07:40"
    summary: "Polite agent, but the call starts before 08:00."
    agent: A1
    date: "2026-10-14"
    time: "07:40"
    answered_by: borrower
    borrower: {name: "Ajay Mhatre", voice: m1}
    facts: {product: "personal loan", emi_inr: 5000, dpd_days: 9}
    hero: false
    hard_negative: false
    turns:
      - s: A
        t: "Good morning sir, Amit bol raha hoon Tarang Finserv se. Call record ho rahi hai. Kya Ajay Mhatre ji baat kar rahe hain?"
        L: [[R1, "*"]]
      - {s: B, t: "Haan, bolto. Itni subah kaay zhala?"}
      - {s: A, t: "Sorry sir, subah subah phone kiya. Aapki paanch hazaar rupaye ki EMI pending hai, bas yaad dilana tha."}
      - {s: B, t: "Theek aahe, Friday ko bhar dunga."}
      - {s: A, t: "Dhanyavaad sir. Main Friday ko reminder bhej dunga. Phir se sorry subah ke liye."}
  - id: c20
