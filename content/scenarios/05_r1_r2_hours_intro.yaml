      - {s: A, t: "Sir, aapki chhah hazaar rupaye ki EMI due hai. Kya aap kal tak bhar sakte hain?"}
      - {s: B, t: "Kal nahi, parso. Abhi thoda tight aahe."}
      - {s: A, t: "Theek hai sir, parso note kar leti hoon. Dhanyavaad."}
