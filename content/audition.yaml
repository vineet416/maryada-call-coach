# The FIRST listening test (notebook 01). ~14 short clips, ~1 minute of audio, < 2,000 characters (about Rs 5).
# Goal: the user picks (a) voices, (b) Roman vs Devanagari text, (c) whether audio tags work.
# Variants: V1 = Roman text, language hi-IN | V2 = Devanagari text, language hi-IN | TAG = one tagged line (A3 only)
clips:
  - id: A1_agent_open
    note: "Hero call turn 1 (agent identifies + recording notice). Compare Avinash vs Prakash."
    role: agent_m2
    voices: [Avinash, Prakash]
    variants:
      V1: "Namaste madam, main Rohit bol raha hoon Tarang Finserv se. Yeh call quality ke liye record ho rahi hai. Kya main Smita Patil ji se baat kar raha hoon?"
      V2: "नमस्ते मैडम, मैं रोहित बोल रहा हूँ तारंग फिनसर्व से। यह कॉल क्वालिटी के लिए रिकॉर्ड हो रही है। क्या मैं स्मिता पाटिल जी से बात कर रहा हूँ?"
  - id: A2_borrower_job
    note: "Hero turn 4. The ONE female borrower voice, Chetana, fixed for the hero call (no voice comparison; the clip checks her quality). Natural Mumbai-style Hinglish."
    role: borrower_f
    voices: [Chetana]
    variants:
      V1: "Sir, please thoda samjho na. Meri job chali gayi hai, do mahine ho gaye. Next week tak thoda paisa aa jayega, par ek saath poora nahi de paungi."
      V2: "सर, प्लीज़ थोड़ा समझो ना। मेरी जॉब चली गई है, दो महीने हो गए। नेक्स्ट वीक तक थोड़ा पैसा आ जाएगा, पर एक साथ पूरा नहीं दे पाऊँगी।"
  - id: A3_agent_threat
    note: "Hero turn 5 (the violation). Needs an irritated, impatient tone but NOT shouting. Also test one tagged variant."
    role: agent_m2
    voices: [Avinash]
    variants:
      V1: "Roz yahi bahana sunte hain. Agar kal tak paisa jama nahi hua na, toh main police ko bhejunga aapke ghar, aur aapke mohalle mein sabko bata dunga ki aap defaulter ho. Court ka notice bhi kal subah aa jayega."
      V2: "रोज़ यही बहाना सुनते हैं। अगर कल तक पैसा जमा नहीं हुआ ना, तो मैं पुलिस को भेजूँगा आपके घर, और आपके मोहल्ले में सबको बता दूँगा कि आप डिफॉल्टर हो। कोर्ट का नोटिस भी कल सुबह आ जाएगा।"
      TAG: "<angry> Roz yahi bahana sunte hain. Agar kal tak paisa jama nahi hua na, toh main police ko bhejunga aapke ghar."
  - id: A4_coach_R5
    note: "Coach nudge for the hero moment. Compare Kalpana vs Shubham. Calm, short, helpful."
    role: coach
    voices: [Kalpana, Shubham]
    variants:
      V1: "Ruk jaiye — dhamki aur galat baatein mat kijiye. Sahi process samjhaiye."
      V2: "रुकिए — धमकी और ग़लत बातें मत कीजिए। सही प्रोसेस समझाइए।"
  - id: A5_female_agent
    note: "Female agent voice. Compare Shivani vs Lakshmi for the agent."
    role: agent_f1
    voices: [Shivani, Lakshmi]
    variants:
      V1: "Madam, aapki EMI paanch hazaar paanch sau rupaye ki due hai. Aaj hi payment chahiye."
      V2: "मैडम, आपकी ईएमआई पाँच हज़ार पाँच सौ रुपये की ड्यू है। आज ही पेमेंट चाहिए।"
  - id: A6_male_borrower
    note: "Male borrower for the other calls, natural Mumbai-style Hinglish. Compare Devansh vs Yashraj. (Other calls may use any male or female borrower voice.)"
    role: borrower_m1
    voices: [Devansh, Yashraj]
    variants:
      V1: "Sir, aaj nahi ho payega. Shop band thi, Friday tak thoda paisa de dunga."
      V2: "सर, आज नहीं हो पाएगा। शॉप बंद थी, फ्राइडे तक थोड़ा पैसा दे दूँगा।"
  - id: A7_neighbour
    note: "Third party (neighbour), natural Mumbai-style Hinglish. Shubham vs Yashraj."
    role: neighbour_m
    voices: [Shubham, Yashraj]
    variants:
      V1: "Nahi bhai, main padosi hoon. Anand bahar gaya hai. Kya hua, kuch problem hai kya?"
      V2: "नहीं भाई, मैं पड़ोसी हूँ। आनंद बाहर गया है। क्या हुआ, कुछ प्रॉब्लम है क्या?"
  - id: A8_voiceover
    note: "Video voice-over, English with an Indian accent. Kalpana vs Lakshmi vs Avinash."
    role: vo
    voices: [Kalpana, Lakshmi, Avinash]
    variants:
      V1: "This recovery call just broke two RBI rules in twenty seconds. Maryada caught both, live."
stt_roundtrip:      # notebook 01 last cell: send each clip back through Prisma and report keyword recovery
  key_terms_hint: ["Tarang Finserv", "EMI", "police", "mohalle", "defaulter", "Court", "notice", "job", "payment"]
listen_for: ["natural pace", "natural Mumbai-style Hinglish on the borrower lines", "numbers and 'EMI' pronounced clearly", "angry-but-not-shouting threat", "coach calm and clear", "voice genders as assumed"]

trio:             # DISTINCTNESS TEST: the three voices of the hero scene in every agent x coach combination (borrower fixed: Chetana) (coach fixed per option)
  note: "Hero = male agent + FEMALE borrower + coach (a male coach, Shubham, is tested too so the user can hear the most distinct trio). Generate each voice's line once and assemble the 4 combinations by concatenation (no extra TTS). Assemble each combo as a ~15 s mini-scene: borrower line (A2), agent threat line (A3), then the coach line (A4). Agent+borrower go through the phone chain; coach is clean, 4 dB quieter than the agent. Save as trio__<agent>_<borrower>_<coach>.mp3. The user picks the combo where all three are easiest to tell apart."
  agents: [Avinash, Prakash]
  borrowers: [Chetana]      # the single female hero borrower
  coaches: [Kalpana, Shubham]
  clips_used: [A2_borrower_job, A3_agent_threat, A4_coach_R5]

round2:           # second listening round (notebooks/01b_audition_round2.py); V2 = Devanagari text
  note: "Borrower texts come from the c06 turns (td). The voice-over has one line so far (A8); this is the same line written in Devanagari (transliteration, nothing added)."
  vo_devanagari: "दिस रिकवरी कॉल जस्ट ब्रोक टू आरबीआई रूल्स इन ट्वेंटी सेकंड्स। मर्यादा कॉट बोथ, लाइव।"
  vo_voices: [Shubham, Prakash, Avinash]
  vo_slow_speed: 0.9          # the API documents speed 0.85-1.15; one slower variant for the first voice
