      - "line recorded | लाइन रिकॉर्डेड"
      - "recording ho rahi | रिकॉर्डिंग हो रही"
  G1:
    good_practice_patterns:
      - "samajh sakta hoon | समझ सकता हूँ"
      - "samajh sakti hoon | समझ सकती हूँ"
      - "koi dikkat | कोई दिक्कत"
      - "option | ऑप्शन"
      - "restructure | रिस्ट्रक्चर"
      - "dhanyavaad | धन्यवाद"
      - "afsos | अफ़सोस"
      - "dhyan rakhiye | ध्यान रखिए"
      - "sorry sir | सॉरी सर"
      - "kripya | कृपया"
      - "mujhe afsos hai | मुझे अफ़सोस है"
      - "chinta mat kijiye | चिंता मत कीजिए"
      - "rahat ka option | राहत का ऑप्शन"
      - "relief ka option | रिलीफ़ का ऑप्शन"
      - "khayal rakhiye | ख़याल रखिए"

hard_negative_notes: |
  These are NOT violations and must not be flagged: true statements about late fee, credit score impact, or that a notice
  "can be sent" per the agreement; firm-but-polite requests for payment by a date; asking for the borrower or leaving a
  callback message with a family member without mentioning the loan.

coach_lines:       # pre-generated with Timbre (role: coach); <= 14 words each; natural Hinglish
  R1:
    - "Ruk jaiye — abhi call karne ka sahi samay nahi hai. Baad mein call kijiye."
    - "Time dekhiye — call sirf subah aath se shaam saat ke beech hi karni hai."
    - "Yeh sahi waqt nahi hai. Politely maafi maangiye aur baad mein call kijiye."
  R2:
    - "Pehle apna naam, company aur call recording ka bataiye."
    - "Rukiye — borrower ko bataiye aap kaun hain aur call record ho rahi hai."
    - "Introduction chhoot gaya. Naam, company aur recording notice abhi bol dijiye."
  R3:
    - "Rukiye — yahan dhamki mat dijiye. Shaanti se EMI ka option batayiye."
    - "Awaaz neeche rakhiye. Izzat se baat kijiye aur payment ka plan poochiye."
    - "Yeh bhasha theek nahi hai. Politely dobara bolein."
  R4:
    - "Dhyan dijiye — yeh borrower nahi hain. Loan ki baat bilkul mat kijiye."
    - "Sirf callback ka message chhodiye. Loan ki details kisi aur ko nahi batani."
    - "Rukiye. Dues sirf borrower se discuss karne hain, kisi aur se nahi."
  R5:
    - "Ruk jaiye — dhamki aur galat baatein mat kijiye. Sahi process samjhaiye."
    - "Galat darr mat dikhaiye. Agreement ke hisaab se sach batayiye."
    - "Court ya police ki jhooti baat mat kijiye. Sahi process samjhaiye."
  R6:
    - "Rukiye — unka ghar mushkil waqt mein hai. Payment ki baat baad mein kijiye."
    - "Pehle hamdardi dikhaiye. Payment ke liye thodi der baad poochiye."
    - "Abhi pressure mat daaliye. Unka haal poochiye aur baad mein call kijiye."
  G1:             # praise, played rarely (max once per call), no risk change
    - "Bahut badhiya — aapne tameez se baat ki."
    - "Achha kiya! Aise hi option dekar baat kijiye."


