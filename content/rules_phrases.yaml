# Phrase lists for the deterministic prefilter + coach lines. Format: "roman | devanagari". Match after normalisation
# (lowercase, strip punctuation, collapse spaces); STT output may be Devanagari for Hindi words and Roman for English words (codemix), so BOTH forms matter.
# strength: strong = confidence 0.9 on exact multi-word match; weak = 0.6 (needs LLM agreement to become a violation).
# Phrases may be ADDED while tuning on the tune set (docs/03 §5, content/split.yaml) but must not remove these.
version: rb-2026.11-v1
rules:
  R3:
    strong:
      - "sharam nahi aati | शर्म नहीं आती"
      - "bewakoof | बेवकूफ"
      - "nikamme | निकम्मे"
      - "nalayak | नालायक"
      - "badtameez | बदतमीज़"
      - "gadha | गधा"
      - "dekh lunga | देख लूंगा"
      - "dekh lena warna | देख लेना वरना"
      - "ghar aake tamasha | घर आके तमाशा"
      - "tamasha karunga | तमाशा करूंगा"
      - "badnaam kar dunga | बदनाम कर दूंगा"
      - "sabko bata dunga | सबको बता दूंगा"
      - "padosiyon ko pata chalega | पड़ोसियों को पता चलेगा"
      - "izzat utaar | इज़्ज़त उतार"
      - "chhodunga nahi | छोडूंगा नहीं"
      - "haath pair tod | हाथ पैर तोड़"
      - "zindagi barbaad | ज़िंदगी बर्बाद"
      - "himmat nahi hai kya | हिम्मत नहीं है क्या"
      - "kaisa insaan hai aap | कैसा इंसान है आप"
      - "kaise insaan hain aap | कैसे इंसान हैं आप"
      - "izzat kamaai jaati hai | इज़्ज़त कमाई जाती है"
      - "bhaagne ka sochna bhi mat | भागने का सोचना भी मत"
      - "hoshiyari mat dikha | होशियारी मत दिखा"
      - "aapko sharam nahi aati | आपको शर्म नहीं आती"
      - "aap bewakoof ho kya | आप बेवकूफ हो क्या"
      - "nikamme ho aap | निकम्मे हो आप"
      - "zyada hoshiyari mat | ज़्यादा होशियारी मत"
      - "tere ghar aake | तेरे घर आके"
      - "mohalle mein sabko bata | मोहल्ले में सबको बता"
      - "khud kamaane ki himmat nahi | ख़ुद कमाने की हिम्मत नहीं"
      - "zubaan ka koi mol nahi | ज़ुबान का कोई मोल नहीं"
      - "mujhse bura koi nahi hoga | मुझसे बुरा कोई नहीं होगा"
      - "sharam karo | शर्म करो"
    weak:
      - "bahane mat banao | बहाने मत बनाओ"
      - "jhooth bol rahe ho | झूठ बोल रहे हो"
      - "warna dekh lena | वरना देख लेना"
      - "kal subah tak chahiye | कल सुबह तक चाहिए"
      - "tu sunta hi nahi | तू सुनता ही नहीं"
      - "ullu | उल्लू"
      - "pagal ho kya | पागल हो क्या"
      - "har baar yahi kahani | हर बार यही कहानी"
  R5:
    strong:
      - "police ko bhej | पुलिस को भेज"
      - "arrest warrant | अरेस्ट वारंट"
      - "warrant nikal | वारंट निकल"
      - "pakad legi | पकड़ लेगी"
      - "court ka notice | कोर्ट का नोटिस"
      - "court mein case | कोर्ट में केस"
      - "jail | जेल"
      - "seize kar legi | सीज़ कर लेगी"
      - "sealed hogi | सील होगी"
      - "notice ki zarurat nahi | नोटिस की ज़रूरत नहीं"
      - "RBI ki taraf se | आरबीआई की तरफ से"
      - "RBI aapka loan account block | आरबीआई आपका लोन अकाउंट ब्लॉक"
      - "har din paanch hazaar rupaye penalty | हर दिन पाँच हज़ार रुपये पेनल्टी"
      - "FIR | एफआईआर"
      - "police aapke ghar aayegi | पुलिस आपके घर आएगी"
      - "giraftaar ho jaoge | गिरफ्तार हो जाओगे"
      - "court se aapke naam par | कोर्ट से आपके नाम पर"
      - "warrant ruk sakta | वारंट रुक सकता"
      - "ghar aur gaadi seize | घर और गाड़ी सीज़"
      - "court mein case dal | कोर्ट में केस डाल"
      - "property kal sealed | प्रॉपर्टी कल सील"
      - "loan account block | लोन अकाउंट ब्लॉक"
    weak:
      - "legal action kal | लीगल एक्शन कल"
      - "blacklist | ब्लैकलिस्ट"
      - "zindagi bhar loan nahi milega | ज़िंदगी भर लोन नहीं मिलेगा"
      - "RBI ka rule hai | आरबीआई का रूल है"
      - "kisi bank se loan nahi milega | किसी बैंक से लोन नहीं मिलेगा"
  R4:        # only evaluated when the call was answered by someone other than the borrower
    disclosure_triggers:
      - "loan liya hai | लोन लिया है"
      - "loan liya tha | लोन लिया था"
      - "EMI pending | ईएमआई पेंडिंग"
      - "EMI nahi | ईएमआई नहीं"
      - "EMI nahi bhar | ईएमआई नहीं भर"
      - "default ho gaya | डिफॉल्ट हो गया"
      - "overdue | ओवरड्यू"
      - "paisa baaki | पैसा बाकी"
      - "recovery ke liye | रिकवरी के लिए"
      - "dhokha de raha | धोखा दे रहा"
      - "paisa wapas nahi | पैसा वापस नहीं"
      - "karj | कर्ज"
      - "unka loan default | उनका लोन डिफॉल्ट"
      - "EMI nahi aayi | ईएमआई नहीं आई"
      - "car loan ki EMI | कार लोन की ईएमआई"
    shaming_triggers:
      - "sab padosi jaan lein | सब पड़ोसी जान लें"
      - "society mein sabko pata | सोसाइटी में सबको पता"
      - "sabko pata chalna chahiye | सबको पता चलना चाहिए"
    safe_patterns:      # agent only asks for the borrower / leaves a callback message -> NOT a violation
      - "wapas call kar | वापस कॉल कर"
      - "zaroori call | ज़रूरी कॉल"
      - "kya unse baat ho sakti hai | क्या उनसे बात हो सकती है"
      - "phone aaya tha | फोन आया था"
      - "baat unse hi karni | बात उनसे ही करनी"
  R6:
    borrower_context_triggers:      # borrower mentions a sensitive occasion (context for the LLM / prefilter)
      - "nidhan | निधन"
      - "mrityu | मृत्यु"
      - "guzar gaye | गुज़र गए"
      - "antim sanskar | अंतिम संस्कार"
      - "terahvi | तेरहवीं"
      - "hospital | हॉस्पिटल"
      - "operation | ऑपरेशन"
      - "bimaar | बीमार"
      - "pitaji guzar gaye | पिताजी गुज़र गए"
      - "hospital mein hoon | हॉस्पिटल में हूँ"
      - "mummy hospital mein | मम्मी हॉस्पिटल में"
      - "operation chalu | ऑपरेशन चालू"
      - "accident | एक्सिडेंट"
      - "ICU | आईसीयू"
      - "shaadi | शादी"
    agent_pressing_patterns:
      - "aaj hi kuch bhej | आज ही कुछ भेज"
      - "aaj hi online kar | आज ही ऑनलाइन कर"
      - "kal tak payment zaroori | कल तक पेमेंट ज़रूरी"
      - "kuch toh bhejna padega | कुछ तो भेजना पड़ेगा"
      - "due date nikal chuki | ड्यू डेट निकल चुकी"
      - "do hafte toh bahut hain | दो हफ्ते तो बहुत हैं"
      - "is hafte kuch toh bhejna | इस हफ्ते कुछ तो भेजना"
  R2:
    identification_patterns:      # name + lender
      - "bol raha hoon Tarang Finserv | बोल रहा हूँ तारंग फिनसर्व"
      - "bol rahi hoon Tarang Finserv | बोल रही हूँ तारंग फिनसर्व"
      - "Tarang Finserv se | तारंग फिनसर्व से"
      - "bol raha hoon, Tarang Finserv | बोल रहा हूँ, तारंग फिनसर्व"
      - "bol rahi hoon, Tarang Finserv | बोल रही हूँ, तारंग फिनसर्व"
